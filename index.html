<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Sheet Generator</title>
<style>
  /* ---------- Basic Reset ---------- */
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 20px;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    color: #222;
  }

  h1 {
    font-size: 22px;
    text-align: center;
    margin-bottom: 20px;
  }

  /* ---------- Form Layout ---------- */
  .form-container {
    max-width: 600px;
    margin: 0 auto 20px auto;
    background: #fafafa;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 16px;
  }

  .form-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 10px;
  }

  .form-group {
    flex: 1;
    min-width: 140px;
    display: flex;
    flex-direction: column;
  }

  label {
    font-size: 13px;
    margin-bottom: 4px;
    font-weight: bold;
  }

  input[type="text"],
  input[type="number"] {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }

  /* ---------- Buttons ---------- */
  .button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  button {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    flex: 1;
    min-width: 120px;
  }

  button:hover {
    background: #1d4ed8;
  }

  button:active {
    background: #1e40af;
  }

  /* ---------- Table ---------- */
  .table-container {
    max-width: 900px;
    margin: 0 auto;
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #f5f5f5;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 8px 10px;
    text-align: left;
    font-size: 14px;
  }

  th {
    background: #e0e0e0;
  }

  tr:nth-child(even) {
    background: #ececec;
  }

  .row-actions {
    display: flex;
    gap: 6px;
  }

  .row-actions button {
    padding: 6px 10px;
    font-size: 12px;
    min-width: 60px;
    flex: none;
  }

  .empty-msg {
    text-align: center;
    padding: 12px;
    color: #777;
    font-size: 14px;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 500px) {
    .form-group {
      min-width: 100%;
    }
    button {
      min-width: 100%;
    }
  }
</style>
</head>
<body>

<h1>Student Sheet Generator</h1>

<!-- ================= FORM ================= -->
<div class="form-container">
  <div class="form-row">
    <div class="form-group">
      <label for="startSerial">Starting Serial Number</label>
      <input type="number" id="startSerial" value="1">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="nameInput">Name</label>
      <input type="text" id="nameInput" placeholder="Enter student name">
    </div>
    <div class="form-group">
      <label for="classInput">Class</label>
      <input type="text" id="classInput" placeholder="Enter class">
    </div>
    <div class="form-group">
      <label for="rollInput">Roll Number</label>
      <input type="text" id="rollInput" placeholder="Enter roll number">
    </div>
  </div>

  <div class="button-row">
    <button id="addBtn">Add Student</button>
    <button id="updateBtn" style="display:none;">Update Student</button>
    <button id="clearBtn">Clear Form</button>
    <button id="downloadBtn">Download Word</button>
  </div>
</div>

<!-- ================= TABLE ================= -->
<div class="table-container">
  <table id="studentTable">
    <thead>
      <tr>
        <th>Serial No</th>
        <th>Name</th>
        <th>Class</th>
        <th>Roll Number</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <!-- Rows inserted dynamically -->
    </tbody>
  </table>
  <div id="emptyMsg" class="empty-msg">No students added yet.</div>
</div>

<script>
  // ============================================================
  // Student Sheet Generator - Vanilla JS Logic
  // Data is stored only in memory (an array) until export.
  // ============================================================

  // Array holding student records: { name, className, roll }
  // Serial numbers are NOT stored - they are always calculated
  // dynamically from the "Starting Serial Number" + index.
  let students = [];

  // Tracks which student (by array index) is currently being edited.
  // null means "Add" mode, a number means "Edit" mode.
  let editingIndex = null;

  // ---------- DOM References ----------
  const startSerialInput = document.getElementById('startSerial');
  const nameInput = document.getElementById('nameInput');
  const classInput = document.getElementById('classInput');
  const rollInput = document.getElementById('rollInput');

  const addBtn = document.getElementById('addBtn');
  const updateBtn = document.getElementById('updateBtn');
  const clearBtn = document.getElementById('clearBtn');
  const downloadBtn = document.getElementById('downloadBtn');

  const tableBody = document.getElementById('tableBody');
  const emptyMsg = document.getElementById('emptyMsg');

  // ---------- Render Table ----------
  // Rebuilds the visible table rows based on the `students` array.
  // Serial numbers are recalculated every time from startSerial.
  function renderTable() {
    tableBody.innerHTML = '';

    if (students.length === 0) {
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    // Parse the starting serial number (default to 1 if invalid)
    const startSerial = parseInt(startSerialInput.value, 10) || 1;

    students.forEach((student, index) => {
      const serialNo = startSerial + index; // continuous, no gaps

      const tr = document.createElement('tr');

      tr.innerHTML = `
        <td>${serialNo}</td>
        <td>${escapeHtml(student.name)}</td>
        <td>${escapeHtml(student.className)}</td>
        <td>${escapeHtml(student.roll)}</td>
        <td>
          <div class="row-actions">
            <button class="edit-btn" data-index="${index}">Edit</button>
            <button class="delete-btn" data-index="${index}">Delete</button>
          </div>
        </td>
      `;

      tableBody.appendChild(tr);
    });

    // Attach event listeners to newly created buttons
    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => startEdit(parseInt(btn.dataset.index, 10)));
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteStudent(parseInt(btn.dataset.index, 10)));
    });
  }

  // Basic HTML escaping to avoid broken table rendering if user
  // enters characters like < or >.
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- Add Student ----------
  addBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    const className = classInput.value.trim();
    const roll = rollInput.value.trim();

    if (!name || !className || !roll) {
      alert('Please fill in Name, Class, and Roll Number.');
      return;
    }

    students.push({ name, className, roll });
    renderTable();
    clearFormFields();
  });

  // ---------- Edit Student ----------
  function startEdit(index) {
    const student = students[index];
    if (!student) return;

    nameInput.value = student.name;
    classInput.value = student.className;
    rollInput.value = student.roll;

    editingIndex = index;

    // Switch buttons: show "Update", hide "Add"
    addBtn.style.display = 'none';
    updateBtn.style.display = 'inline-block';
  }

  // ---------- Update (Save Edit) ----------
  updateBtn.addEventListener('click', () => {
    if (editingIndex === null) return;

    const name = nameInput.value.trim();
    const className = classInput.value.trim();
    const roll = rollInput.value.trim();

    if (!name || !className || !roll) {
      alert('Please fill in Name, Class, and Roll Number.');
      return;
    }

    students[editingIndex] = { name, className, roll };
    editingIndex = null;

    // Switch buttons back to "Add" mode
    addBtn.style.display = 'inline-block';
    updateBtn.style.display = 'none';

    renderTable();
    clearFormFields();
  });

  // ---------- Delete Student ----------
  function deleteStudent(index) {
    students.splice(index, 1);
    // Serial numbers auto-regenerate on next renderTable()
    // since they are calculated from startSerial + array index.
    renderTable();

    // If we were editing the deleted row, cancel edit mode
    if (editingIndex === index) {
      editingIndex = null;
      addBtn.style.display = 'inline-block';
      updateBtn.style.display = 'none';
      clearFormFields();
    }
  }

  // ---------- Clear Form ----------
  // Clears Name, Class, Roll Number only.
  // Starting Serial Number is left untouched, as required.
  function clearFormFields() {
    nameInput.value = '';
    classInput.value = '';
    rollInput.value = '';
    nameInput.focus();
  }

  clearBtn.addEventListener('click', () => {
    clearFormFields();
    // Also cancel any in-progress edit
    editingIndex = null;
    addBtn.style.display = 'inline-block';
    updateBtn.style.display = 'none';
  });

  // Re-render table if the starting serial number is changed,
  // so on-screen serials always stay accurate.
  startSerialInput.addEventListener('input', renderTable);

  // ---------- Download Word (.doc) ----------
  downloadBtn.addEventListener('click', () => {
    if (students.length === 0) {
      alert('No students to export. Please add at least one student.');
      return;
    }

    const startSerial = parseInt(startSerialInput.value, 10) || 1;

    // Build table rows in the EXPORT column order:
    // S.No | Name | Roll Number | Class
    let rowsHtml = '';
    students.forEach((student, index) => {
      const serialNo = startSerial + index;
      rowsHtml += `
        <tr>
          <td>${escapeHtml(String(serialNo))}</td>
          <td>${escapeHtml(student.name)}</td>
          <td>${escapeHtml(student.roll)}</td>
          <td>${escapeHtml(student.className)}</td>
        </tr>`;
    });

    // Minimal Word-compatible HTML document.
    // No header, title, logo, footer, or watermark - table only.
    const docHtml = `
      <html xmlns:o="urn:schemas-microsoft-com:office:office"
            xmlns:w="urn:schemas-microsoft-com:office:word"
            xmlns="http://www.w3.org/TR/REC-html40">
      <head>
        <meta charset="UTF-8">
        <style>
          table { border-collapse: collapse; width: 100%; }
          td, th { border: 1px solid #000000; padding: 5px 8px; font-family: Arial, sans-serif; font-size: 12pt; }
          th { background: #d9d9d9; font-weight: bold; }
        </style>
      </head>
      <body>
        <table>
          <thead>
            <tr>
              <th>S.No</th>
              <th>Name</th>
              <th>Roll Number</th>
              <th>Class</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>
      </body>
      </html>
    `;

    // Create a Blob with Word-compatible MIME type and trigger download.
    const blob = new Blob(['\ufeff', docHtml], {
      type: 'application/msword'
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'Student_Sheet.doc';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  });

  // ---------- Initial Render ----------
  renderTable();
</script>

</body>
</html>
